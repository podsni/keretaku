<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="12" y1="44" x2="52" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="body" x1="32" y1="10" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE4EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="20" y1="18" x2="44" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Subtle Speed Diagonal Ribbon -->
  <path d="M4 43L60 21V29L4 51V43Z" fill="url(#accent)" fill-opacity="0.22"/>

  <!-- Perspective Rails -->
  <path d="M23 47L14 58H19.5L27 47H23Z" fill="#94A3B8"/>
  <path d="M41 47L50 58H44.5L37 47H41Z" fill="#94A3B8"/>
  <rect x="18" y="52.5" width="28" height="2.4" rx="1.2" fill="#475569"/>

  <!-- Modern Aerodynamic Locomotive / EMU Body -->
  <path d="M20 17C20 12.6 23.6 10 28 10H36C40.4 10 44 12.6 44 17L46.5 39C46.9 43.2 43.6 47 39.3 47H24.7C20.4 47 17.1 43.2 17.5 39L20 17Z" fill="url(#body)"/>

  <!-- Roof Destination Bar -->
  <rect x="26" y="12.5" width="12" height="2.6" rx="1.3" fill="#0F172A" fill-opacity="0.75"/>

  <!-- Wraparound Cockpit Windshield -->
  <path d="M22.2 18.5C22.5 17.1 23.7 16.2 25.1 16.2H38.9C40.3 16.2 41.5 17.1 41.8 18.5L43 26.8C43.2 28.1 42.2 29.2 40.9 29.2H23.1C21.8 29.2 20.8 28.1 21 26.8L22.2 18.5Z" fill="url(#glass)"/>
  <!-- Windshield Reflection -->
  <path d="M24.2 18.2H30.5L26.5 27.2H22.8L24.2 18.2Z" fill="#60A5FA" fill-opacity="0.28"/>

  <!-- Iconic Indonesian Railway Livery Stripe -->
  <path d="M18.2 32.5H45.8L46.2 36.2H17.8L18.2 32.5Z" fill="url(#accent)"/>

  <!-- Dual Headlights -->
  <circle cx="24" cy="41.2" r="2.6" fill="#FDE047"/>
  <circle cx="24" cy="41.2" r="1.2" fill="#FFFFFF"/>
  <circle cx="40" cy="41.2" r="2.6" fill="#FDE047"/>
  <circle cx="40" cy="41.2" r="1.2" fill="#FFFFFF"/>

  <!-- Coupler Center Accent -->
  <rect x="29" y="40.5" width="6" height="2.4" rx="1.2" fill="#334155"/>

  <!-- Live Signal Pulse Indicator (Top-Right) -->
  <circle cx="51" cy="13" r="8.5" fill="#10B981" fill-opacity="0.24"/>
  <circle cx="51" cy="13" r="5" fill="#10B981" stroke="#0F172A" stroke-width="1.8"/>
</svg>
